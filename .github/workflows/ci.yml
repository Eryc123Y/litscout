name: CI
# Checks run locally before merging: `nice -n 10 pnpm verify` (see docs/self-host.md).
# This workflow runs the same command on every pull request and on pushes to main.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
# A newer push to the same branch or pull request replaces the run before it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
      - name: Upload the rehearsal transcript
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rehearsal-transcript
          path: .artifacts/rehearsal.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
