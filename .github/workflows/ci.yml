name: CI
# Checks run locally before merging: `nice -n 10 pnpm verify` (see docs/development.md).
# This workflow runs the same checks as parallel jobs on every pull request and on
# pushes to main. `verify` passes only when every other job passed or was skipped.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
# A newer push to the same branch or pull request replaces the run before it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  scope:
    name: Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Documentation-only changes skip the code jobs; a hand-dispatched run has
      # no base, so it runs everything.
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tools/ci-scope.mjs "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"

  quick:
    name: Audit and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm check:quick
      - run: pnpm audit --audit-level high

  static:
    name: Types and lint
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - run: pnpm lint

  # The unit tests run in two shards; `coverage` merges their reports and
  # checks the coverage gates on the whole, as `pnpm test:coverage` does locally.
  unit:
    name: Unit tests (${{ matrix.shard }}/2)
    needs: scope
    if: needs.scope.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test:shard ${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        with:
          name: unit-report-${{ matrix.shard }}
          path: .vitest/blob
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  coverage:
    name: Coverage and imported tests
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          pattern: unit-report-*
          path: .vitest/blob
          merge-multiple: true
      - run: pnpm test:merge
      - run: node tools/audit.mjs --tests

  # Desktop and phone flows run on separate machines, each with its own local
  # server: the flows share one fixture database within a run, so each
  # project stays serial on its machine (playwright.config.ts).
  browser:
    name: Browser tests (${{ matrix.project }})
    needs: scope
    if: needs.scope.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, phone]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --project=${{ matrix.project }}

  build:
    name: Build, smoke tests and rehearsal
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm smoke
      - name: Upload the rehearsal transcript
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rehearsal-transcript
          path: .artifacts/rehearsal.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  verify:
    name: verify
    if: always()
    needs: [scope, quick, static, unit, coverage, browser, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          SCOPE: ${{ needs.scope.result }}
          QUICK: ${{ needs.quick.result }}
        # The quick checks run on every change and the scope decides the rest:
        # both must have run. The code jobs may be skipped for documentation.
        run: |
          if [ "$SCOPE" != success ] || [ "$QUICK" != success ]; then
            echo "Scope ($SCOPE) and the quick checks ($QUICK) must both succeed"
            exit 1
          fi
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "A job ended with: $result"; exit 1 ;;
            esac
          done
          echo "All jobs passed or were skipped: $RESULTS"
